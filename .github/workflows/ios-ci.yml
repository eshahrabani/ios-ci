name: ios-ci
run-name: ios-ci ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA in the private app repository
        required: true
        type: string
      ref:
        description: Private branch/tag name (diagnostics only)
        required: false
        default: main
        type: string
      correlation_id:
        description: Unique ID used by the private repo to find this run
        required: true
        type: string
      smoke_text:
        description: Text visible on the app's first screen
        required: true
        type: string
      debug_public_logs:
        description: Print raw app build/test output to the public log
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-ci
  cancel-in-progress: true

jobs:
  ios:
    name: ios-simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEBUG_PUBLIC_LOGS: ${{ inputs.debug_public_logs }}
    steps:
      - name: Checkout private app
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.APP_REPO }}
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.APP_DEPLOY_KEY }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      # actions/checkout leaves the deploy key on disk for the whole job even with
      # persist-credentials: false. Nothing below this point needs it, and npm
      # postinstall/build scripts are untrusted code, so remove it here and
      # materialize it again only for the log push.
      - name: Drop checkout credentials before running app code
        run: |
          set -euo pipefail
          removed=0
          while IFS= read -r key; do
            rm -f "$key"
            removed=$((removed + 1))
          done < <(grep -l -- 'PRIVATE KEY' "$RUNNER_TEMP"/* 2>/dev/null || true)
          echo "removed ${removed} key file(s) from RUNNER_TEMP"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install web dependencies
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          npm ci > "$RUNNER_TEMP/ci-logs/npm-ci.log" 2>&1 || {
            echo "npm ci failed"
            if [[ "${DEBUG_PUBLIC_LOGS}" == "true" ]]; then cat "$RUNNER_TEMP/ci-logs/npm-ci.log"; fi
            exit 1
          }

      - name: Build web assets
        working-directory: app
        run: |
          set -euo pipefail
          npm run build > "$RUNNER_TEMP/ci-logs/npm-build.log" 2>&1 || {
            echo "web build failed"
            if [[ "${DEBUG_PUBLIC_LOGS}" == "true" ]]; then cat "$RUNNER_TEMP/ci-logs/npm-build.log"; fi
            exit 1
          }

      - name: Sync Capacitor iOS project
        working-directory: app
        run: |
          set -euo pipefail
          if [[ ! -d ios/App ]]; then npx cap add ios; fi
          npx cap sync ios > "$RUNNER_TEMP/ci-logs/cap-sync.log" 2>&1 || {
            echo "cap sync failed"
            if [[ "${DEBUG_PUBLIC_LOGS}" == "true" ]]; then cat "$RUNNER_TEMP/ci-logs/cap-sync.log"; fi
            exit 1
          }

      - name: Build for iOS Simulator
        working-directory: app
        run: |
          set -euo pipefail
          if [[ -d ios/App/App.xcworkspace ]]; then
            PROJECT=(-workspace ios/App/App.xcworkspace)
          else
            PROJECT=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${PROJECT[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build > "$RUNNER_TEMP/ci-logs/xcodebuild.log" 2>&1 || {
              echo "xcodebuild failed"
              if [[ "${DEBUG_PUBLIC_LOGS}" == "true" ]]; then cat "$RUNNER_TEMP/ci-logs/xcodebuild.log"; fi
              exit 1
            }

      - name: Boot simulator and install app
        working-directory: app
        timeout-minutes: 10
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | .key as $runtime | .value[]
             | select(.name | test("^iPhone")) | {runtime: $runtime, name: .name, udid: .udid}]
            | (map(select(.name == "iPhone 17")) | sort_by(.runtime) | last)
              // (sort_by(.runtime) | last)
            | "\(.name) \(.udid)"')
          if [[ -z "$DEVICE" || "$DEVICE" == "null"* ]]; then
            echo "no iPhone simulator found"
            xcrun simctl list devices available | head -30
            exit 1
          fi
          UDID=${DEVICE##* }
          echo "simulator: ${DEVICE% *}"
          {
            echo "UDID=$UDID"
            echo "SIMULATOR=${DEVICE% *}"
          } >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          BOOTED=0
          for _ in $(seq 1 270); do
            if xcrun simctl list devices | grep -q "($UDID) (Booted)"; then BOOTED=1; break; fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            echo "simulator $UDID did not reach Booted within 540s"
            xcrun simctl list devices available | head -30
            exit 1
          fi
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" \
            -maxdepth 1 -name 'App.app' | head -n1)
          if [[ -z "$APP_PATH" ]]; then echo "built .app not found"; exit 1; fi
          xcrun simctl install "$UDID" "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.12.1
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Measured on macos-26 + Xcode 26.6: the first XCTest driver start on a fresh
      # simulator spent 5.5 minutes inside `xcodebuild test-without-building` before the
      # runner even launched (18:44:44 -> 18:50:10), so the 300 s limit fired too early;
      # the second start took 21 s. Give the first attempt 480 s. A driver that still
      # never opens its port is an environment failure, not a product failure, so retry
      # that signature once. Assertion failures fail immediately and are never retried.
      #
      # A timed-out attempt leaves its `xcodebuild` running, and it relaunches the runner
      # on its own ("Restarting after unexpected exit, crash, or test timeout"). Observed:
      # attempt 1 respawned a runner at 18:51:59 while attempt 2 was serving requests, and
      # attempt 2's runner died with `ConnectException` on its port. Two XCTest sessions on
      # one simulator kill each other, so reap them between attempts.
      - name: Run Maestro smoke test
        working-directory: app
        timeout-minutes: 20
        env:
          SMOKE_TEXT: ${{ inputs.smoke_text }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          LOGS="$RUNNER_TEMP/ci-logs"
          ART="$RUNNER_TEMP/ci-artifacts"
          mkdir -p "$LOGS" "$ART"
          DRIVER_FAILURE='iOS driver not ready in time|IOSDriverTimeoutException|Failed to connect to'
          # The CLI's own debug log (~/.maestro/**/maestro.log) holds the driver's
          # xcodebuild output, which is the only place a stalled driver start explains
          # itself. Keep the three most recent, capped per file.
          capture_maestro_logs() {
            local attempt="$1" i=0 f files
            files=$(find "$HOME/.maestro" -name maestro.log -type f 2>/dev/null | head -n 50 || true)
            [[ -n "$files" ]] || return 0
            while IFS= read -r f; do
              i=$((i + 1))
              tail -c 2000000 "$f" > "$LOGS/maestro-cli-${attempt}-${i}.log" 2>/dev/null || true
            done < <(printf '%s\n' "$files" | xargs ls -t 2>/dev/null | head -n 3)
            echo "captured ${i} Maestro CLI log(s) for attempt ${attempt}"
          }
          kill_stale_xctest() {
            local pids
            pids=$(pgrep -f 'maestro-driver-iosUITests' 2>/dev/null || true)
            if [[ -z "$pids" ]]; then
              echo "no stale xctest processes"
              return 0
            fi
            echo "killing stale xctest processes: $(echo "$pids" | tr '\n' ' ')"
            # shellcheck disable=SC2086
            kill -9 $pids 2>/dev/null || true
            sleep 2
            echo "remaining: $(pgrep -f 'maestro-driver-iosUITests' 2>/dev/null | tr '\n' ' ')"
          }
          for attempt in 1 2; do
            echo "Maestro attempt ${attempt}/2"
            # bash 3.2 (macOS /bin/bash) treats an empty array as unset under set -u,
            # so optional arguments are plain variables expanded only when set.
            driver_flag=""
            driver_timeout=480000
            if [[ "$attempt" -gt 1 ]]; then
              driver_flag="--reinstall-driver"
              driver_timeout=300000
            fi
            if MAESTRO_DRIVER_STARTUP_TIMEOUT="$driver_timeout" \
              maestro --device="$UDID" test \
              -e APP_ID="$BUNDLE_ID" \
              -e SMOKE_TEXT="$SMOKE_TEXT" \
              --no-ansi \
              --format junit \
              --output "$LOGS/maestro-${attempt}.xml" \
              --test-output-dir "$ART/attempt-${attempt}" \
              --debug-output "$ART/debug-${attempt}" \
              --flatten-debug-output \
              ${driver_flag:+"$driver_flag"} \
              .maestro/ > "$LOGS/maestro-${attempt}.log" 2>&1; then
              capture_maestro_logs "$attempt"
              cp "$LOGS/maestro-${attempt}.log" "$LOGS/maestro.log"
              if [[ -f "$LOGS/maestro-${attempt}.xml" ]]; then
                cp "$LOGS/maestro-${attempt}.xml" "$LOGS/maestro.xml"
              fi
              kill_stale_xctest
              exit 0
            fi
            capture_maestro_logs "$attempt"
            cp "$LOGS/maestro-${attempt}.log" "$LOGS/maestro.log"
            if [[ "$attempt" -eq 1 ]] && grep -qE "$DRIVER_FAILURE" "$LOGS/maestro-${attempt}.log"; then
              echo "Maestro iOS driver did not start; reaping and retrying once"
              kill_stale_xctest
              continue
            fi
            echo "Maestro smoke test failed"
            if [[ "${DEBUG_PUBLIC_LOGS}" == "true" ]]; then
              tail -n 200 "$LOGS/maestro-${attempt}.log"
              cat "$LOGS/maestro-${attempt}.xml" 2>/dev/null || true
            fi
            kill_stale_xctest
            exit 1
          done
          echo "Maestro smoke test did not run"
          exit 1

      - name: Publish logs to private repo
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          CORRELATION: ${{ inputs.correlation_id }}
          APP_SHA: ${{ inputs.sha }}
          APP_REF: ${{ inputs.ref }}
          APP_REPO: ${{ secrets.APP_REPO }}
          APP_DEPLOY_KEY: ${{ secrets.APP_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          LOGS="$RUNNER_TEMP/ci-logs"
          ART="$RUNNER_TEMP/ci-artifacts"
          [[ -d "$LOGS" ]] || { echo "no logs to publish"; exit 0; }
          [[ -d app ]] || { echo "warning: app checkout missing; nothing to publish"; exit 0; }
          [[ -n "${APP_DEPLOY_KEY:-}" ]] || { echo "warning: APP_DEPLOY_KEY is not set"; exit 0; }

          # The deploy key is materialized only here: the build steps run app code and
          # must not be able to reach a key that can write this repository.
          KEY="$RUNNER_TEMP/publish_key"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$APP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/publish_known_hosts"

          {
            echo "run_id: ${RUN_ID}"
            echo "correlation_id: ${CORRELATION}"
            echo "app_sha: ${APP_SHA}"
            echo "app_ref: ${APP_REF}"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "simulator: ${SIMULATOR:-unknown}"
            echo "bundle_id: ${BUNDLE_ID:-unknown}"
            echo "maestro_attempts: $(ls "$LOGS"/maestro-*.log 2>/dev/null | wc -l | tr -d ' ')"
          } > "$LOGS/summary.txt" 2>/dev/null || true

          mkdir -p "$LOGS/maestro"
          if [[ -d "$ART" ]]; then cp -R "$ART"/. "$LOGS/maestro"/ 2>/dev/null || true; fi

          cd app || exit 0
          git config user.name "ios-ci"
          git config user.email "ios-ci@users.noreply.github.com"
          git checkout --orphan "ci-logs-${RUN_ID}" >/dev/null 2>&1 \
            || git checkout -B "ci-logs-${RUN_ID}" >/dev/null 2>&1 || true
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p ci-logs
          cp -R "$LOGS"/. ci-logs/ 2>/dev/null || true
          git add -A ci-logs >/dev/null 2>&1 || true
          git commit -m "CI logs ${RUN_ID} (${CORRELATION})" >/dev/null 2>&1 \
            || { echo "warning: nothing to commit"; exit 0; }
          git push --force "git@github.com:${APP_REPO}.git" "HEAD:refs/heads/ci-logs" \
            || echo "warning: could not publish logs"
