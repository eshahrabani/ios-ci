name: stream probe
run-name: stream probe
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  p:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Foreground vs background streamer
        run: |
          set +e
          mkdir -p /tmp/sp && cd /tmp/sp
          curl -fsSL "https://raw.githubusercontent.com/eshahrabani/ios-ci/main/bin/screen-stream.swift" -o stream.swift
          xcrun swiftc -O -swift-version 5 -o stream stream.swift 2>&1 | tail -3
          ls -l stream
          cat > /tmp/anim.html <<'HTML'
          <!doctype html><meta charset=utf-8>
          <style>html,body{margin:0;height:100%;overflow:hidden;background:#111}
          #d{position:absolute;left:0;top:0;width:100%;height:100%;
          background:repeating-conic-gradient(from 0deg,#09f 0deg 10deg,#f90 10deg 20deg);
          animation:r 1s linear infinite}
          @keyframes r{to{transform:rotate(360deg)}}</style>
          <div id=d></div>
          HTML
          open -a Safari /tmp/anim.html
          sleep 5
          cat > /tmp/sp/sample.py <<'PY'
          import os, sys, time
          out, secs = sys.argv[1], float(sys.argv[2])
          prev, seen, t0 = None, 0, time.time()
          while time.time() - t0 < secs:
              try:
                  stamp = os.stat('/tmp/sp/frame.jpg').st_mtime
              except FileNotFoundError:
                  stamp = None
              if stamp is not None and stamp != prev:
                  seen += 1
                  prev = stamp
              time.sleep(0.01)
          print(f"{out} {seen / secs:.1f} fps ({seen} frames)")
          PY
          rm -f /tmp/sp/frame.jpg /tmp/sp/frame.jpg.tmp
          /tmp/sp/stream /tmp/sp/frame.jpg 30 0.55 1280 2>/tmp/sp/bg.log &
          BG=$!
          sleep 2
          python3 /tmp/sp/sample.py background 8
          echo "background cpu: $(ps -o %cpu= -p $BG)"
          kill $BG 2>/dev/null; wait $BG 2>/dev/null
          rm -f /tmp/sp/frame.jpg /tmp/sp/frame.jpg.tmp
          python3 /tmp/sp/sample.py foreground 10 &
          SAMPLE=$!
          sleep 0.3
          timeout 9 /tmp/sp/stream /tmp/sp/frame.jpg 30 0.55 1280 2>/tmp/sp/fg.log
          wait $SAMPLE
          echo "foreground log: $(tail -1 /tmp/sp/fg.log)"
          echo "background log: $(tail -1 /tmp/sp/bg.log)"
          sips -g pixelWidth -g pixelHeight /tmp/sp/frame.jpg 2>&1 | tail -2
