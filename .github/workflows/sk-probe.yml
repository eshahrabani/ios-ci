name: sk probe
run-name: sk probe
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  p:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Probe ScreenCaptureKit streaming
        run: |
          set +e
          sw_vers
          echo "nproc: $(sysctl -n hw.ncpu)"
          echo "swiftc: $(xcrun --find swiftc 2>&1)"
          echo "ffmpeg: $(command -v ffmpeg || echo none)"
          mkdir -p /tmp/sk && cd /tmp/sk
          cat > main.swift <<'SWIFT'
          import Foundation
          import Darwin
          import ScreenCaptureKit
          import CoreVideo
          import CoreMedia
          import ImageIO
          import UniformTypeIdentifiers

          func err(_ s: String) { FileHandle.standardError.write((s + "\n").data(using: .utf8)!) }

          let args = CommandLine.arguments
          let outPath = args.count > 1 ? args[1] : "/tmp/desktop-frame.jpg"
          let maxFPS = args.count > 2 ? (Double(args[2]) ?? 30) : 30
          let quality = args.count > 3 ? (Double(args[3]) ?? 0.6) : 0.6
          let maxWidth = args.count > 4 ? (Int(args[4]) ?? 1280) : 1280

          func jpegData(_ pb: CVPixelBuffer, quality: Double) -> Data? {
              CVPixelBufferLockBaseAddress(pb, .readOnly)
              defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
              guard let base = CVPixelBufferGetBaseAddress(pb) else { return nil }
              let w = CVPixelBufferGetWidth(pb)
              let h = CVPixelBufferGetHeight(pb)
              let bpr = CVPixelBufferGetBytesPerRow(pb)
              guard bpr >= w * 4 else { return nil }
              let info = CGBitmapInfo(rawValue: CGImageAlphaInfo.noneSkipFirst.rawValue
                  | CGBitmapInfo.byteOrder32Little.rawValue)
              guard let provider = CGDataProvider(dataInfo: nil, data: base, size: bpr * h,
                                                  releaseData: { _, _, _ in }) else { return nil }
              guard let image = CGImage(width: w, height: h, bitsPerComponent: 8, bitsPerPixel: 32,
                                        bytesPerRow: bpr, space: CGColorSpaceCreateDeviceRGB(),
                                        bitmapInfo: info, provider: provider, decode: nil,
                                        shouldInterpolate: false, intent: .defaultIntent) else { return nil }
              let data = NSMutableData()
              guard let dest = CGImageDestinationCreateWithData(data, UTType.jpeg.identifier as CFString,
                                                                1, nil) else { return nil }
              CGImageDestinationAddImage(dest, image,
                  [kCGImageDestinationLossyCompressionQuality: NSNumber(value: quality)] as CFDictionary)
              guard CGImageDestinationFinalize(dest) else { return nil }
              return data as Data
          }

          final class Sink: NSObject, SCStreamOutput, SCStreamDelegate {
              let path: String
              let tmp: String
              let interval: Double
              let quality: Double
              var last = 0.0
              var count = 0

              init(path: String, maxFPS: Double, quality: Double) {
                  self.path = path
                  self.tmp = path + ".tmp"
                  self.interval = maxFPS > 0 ? 1.0 / maxFPS : 0
                  self.quality = quality
              }

              func stream(_ stream: SCStream, didOutputSampleBuffer sampleBuffer: CMSampleBuffer,
                          of type: SCStreamOutputType) {
                  guard type == .screen, sampleBuffer.isValid else { return }
                  let now = Date().timeIntervalSince1970
                  if interval > 0 && now - last < interval { return }
                  guard let pb = CMSampleBufferGetImageBuffer(sampleBuffer),
                        let data = jpegData(pb, quality: quality) else { return }
                  do { try data.write(to: URL(fileURLWithPath: tmp)) } catch { return }
                  let ok = tmp.withCString { s in path.withCString { d in rename(s, d) } }
                  if ok != 0 { return }
                  last = now
                  count += 1
                  if count % 30 == 0 { err("frames \(count) \(data.count) bytes") }
              }

              func stream(_ stream: SCStream, didStopWithError error: Error) {
                  err("stream stopped: \(error)")
                  exit(1)
              }
          }

          var sinkRef: Sink?
          var streamRef: SCStream?

          Task {
              do {
                  let content = try await SCShareableContent.excludingDesktopWindows(false, onScreenWindowsOnly: true)
                  guard let display = content.displays.first else { err("no displays"); exit(2) }
                  let cfg = SCStreamConfiguration()
                  let scale = min(1.0, Double(maxWidth) / Double(display.width))
                  cfg.width = max(2, Int(Double(display.width) * scale))
                  cfg.height = max(2, Int(Double(display.height) * scale))
                  cfg.minimumFrameInterval = CMTime(value: 1, timescale: CMTimeScale(max(1, Int(maxFPS))))
                  cfg.queueDepth = 3
                  cfg.pixelFormat = kCVPixelFormatType_32BGRA
                  cfg.showsCursor = true
                  let filter = SCContentFilter(display: display, excludingWindows: [])
                  let sink = Sink(path: outPath, maxFPS: maxFPS, quality: quality)
                  sinkRef = sink
                  let stream = SCStream(filter: filter, configuration: cfg, delegate: sink)
                  streamRef = stream
                  try stream.addStreamOutput(sink, type: .screen,
                                             sampleHandlerQueue: DispatchQueue(label: "frames"))
                  try await stream.startCapture()
                  err("streaming \(cfg.width)x\(cfg.height) at \(Int(maxFPS)) fps to \(outPath)")
              } catch {
                  err("fatal: \(error)")
                  exit(1)
              }
          }
          RunLoop.main.run()
          SWIFT
          time xcrun swiftc -O -swift-version 5 -o stream main.swift 2>&1 | tail -20
          ls -l stream 2>&1 || exit 0
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for service in kTCCServiceScreenCapture kTCCServiceAccessibility; do
              sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, flags) values ('$service','/tmp/sk/stream',1,2,0,1,0)" 2>&1 | head -1
            done
          done
          sudo killall tccd 2>/dev/null
          cat > /tmp/anim.html <<'HTML'
          <!doctype html><meta charset=utf-8>
          <style>html,body{margin:0;height:100%;overflow:hidden;background:#111}
          #d{position:absolute;left:0;top:0;width:100%;height:100%;
          background:repeating-conic-gradient(from 0deg,#09f 0deg 10deg,#f90 10deg 20deg);
          animation:r 1s linear infinite}
          @keyframes r{to{transform:rotate(360deg)}}</style>
          <div id=d></div>
          HTML
          open -a Safari /tmp/anim.html 2>&1 || open /tmp/anim.html 2>&1
          sleep 4
          rm -f /tmp/pf.jpg /tmp/pf.jpg.tmp
          /tmp/sk/stream /tmp/pf.jpg 30 0.6 1280 2>/tmp/sk/err.log &
          PID=$!
          sleep 6
          python3 - <<'PY'
          import os, time
          seen, prev = 0, None
          t0 = time.time()
          while time.time() - t0 < 6:
              try:
                  stamp = os.stat('/tmp/pf.jpg').st_mtime
              except FileNotFoundError:
                  stamp = None
              if stamp is not None and stamp != prev:
                  seen += 1
                  prev = stamp
              time.sleep(0.005)
          print('distinct frames in 6s:', seen)
          PY
          echo "cpu: $(ps -o %cpu= -p $PID 2>&1)"
          kill $PID 2>/dev/null
          sleep 1
          tail -12 /tmp/sk/err.log
          ls -l /tmp/pf.jpg 2>&1
          sips -g pixelWidth -g pixelHeight /tmp/pf.jpg 2>&1 | tail -2
