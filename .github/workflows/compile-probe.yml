name: compile probe
run-name: compile probe
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  p:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Compile the streamer from the pushed commit
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp && cd /tmp/cp
          curl -fsSL "https://raw.githubusercontent.com/eshahrabani/ios-ci/main/bin/screen-stream.swift" -o main.swift
          xcrun swiftc -O -swift-version 5 -o stream main.swift 2>&1 | tail -30
          ls -l stream
          echo "compiled ok"
