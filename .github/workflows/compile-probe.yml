name: compile-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compile screen-stream
        run: |
          xcrun swiftc -O -swift-version 5 -o "$RUNNER_TEMP/stream" bin/screen-stream.swift
          ls -l "$RUNNER_TEMP/stream"
          echo "compiled ok"
