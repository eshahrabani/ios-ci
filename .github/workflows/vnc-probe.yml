name: vnc-probe
run-name: vnc-probe ${{ inputs.image }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: Runner label to probe
        required: true
        default: macos-26-intel
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ${{ inputs.image }}
    timeout-minutes: 20
    steps:
      - name: Tailscale join
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e
          set -uo pipefail
          TP=$(brew --prefix)
          echo "== brew prefix: $TP"
          time brew install tailscale 2>&1 | tail -6
          echo "== binaries:"; ls -l "$TP/bin/tailscale" "$TP/bin/tailscaled"
          echo "== version:"; "$TP/bin/tailscale" version 2>&1 | head -2
          echo "== install-system-daemon:"
          sudo "$TP/bin/tailscaled" install-system-daemon 2>&1 | tail -8
          echo "== daemon:"; sudo launchctl print system/com.tailscale.tailscaled 2>&1 | head -6
          echo "== up:"
          sudo "$TP/bin/tailscale" up --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="probe-${GITHUB_RUN_ID}-$(uname -m)" --ephemeral --timeout=90s 2>&1 | tail -8
          echo "== status:"
          "$TP/bin/tailscale" status 2>&1 | head -8
          echo "== dnsname: $("$TP/bin/tailscale" status --json 2>/dev/null | jq -r '.Self.DNSName // "MISSING"')"
          echo "== ipv4: $("$TP/bin/tailscale" ip -4 2>&1 | head -1)"
          true

      - name: VNC auth probe
        run: |
          set +e
          set -uo pipefail
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          echo '== kickstart with -setvncpw'
          sudo "$K" -activate -configure -access -on -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw probe123 2>&1 | tail -10
          echo '== launchctl enable + load + kickstart'
          sudo launchctl enable system/com.apple.screensharing 2>&1 | tail -2
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>&1 | tail -2
          sudo launchctl kickstart -k system/com.apple.screensharing 2>&1 | tail -2
          sleep 6
          echo '== listener:'; sudo lsof -iTCP:5900 -sTCP:LISTEN 2>&1 | head -4
          echo '== pref files:'
          sudo ls -l /Library/Preferences/com.apple.VNCSettings.txt \
                      /Library/Preferences/com.apple.RemoteManagement.plist 2>&1
          echo '== RemoteManagement:'; sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>&1 | head -20
          echo '== VNCSettings:'; sudo cat /Library/Preferences/com.apple.VNCSettings.txt 2>&1 | head -3
          echo '== rfb handshake:'
          python3 - <<'PY' 2>&1 | head -10
          import socket
          try:
              s = socket.create_connection(("127.0.0.1", 5900), 5)
              banner = s.recv(12)
              print("banner:", banner)
              s.sendall(b"RFB 003.889\n")
              n = s.recv(1)
              if n:
                  cnt = n[0]
                  if cnt:
                      print("security types:", list(s.recv(cnt)))
                  else:
                      print("refused:", s.recv(1024)[4:].decode(errors="replace"))
          except Exception as e:
              print("error:", e)
          PY
          true
