name: ios-ci
run-name: ios-ci ${{ inputs.correlation_id }}

# One job, one deliverable: a macOS desktop that a browser can drive, ready in about a
# minute. Nothing is checked out and nothing is opened in the VM. The tester's machine
# reaches the runner over the tailnet; the session token never leaves it — only the
# token's SHA-256 is dispatched, and the server compares hashes in constant time.
on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Unique ID the GUI/CLI uses to find this run
        required: true
        type: string
      session_minutes:
        description: Minutes to hold the desktop after it is ready (1-300)
        required: true
        default: '30'
        type: string
      session_token_hash:
        description: Lowercase hex SHA-256 of the session token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Every session gets its own group: a desktop someone is working in must not be
  # cancelled by an unrelated dispatch.
  group: ios-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  macos-desktop:
    name: macos-desktop
    runs-on: macos-26
    # GitHub caps hosted jobs at 360 minutes; the hold is at most 300 plus setup.
    timeout-minutes: 360
    env:
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      SESSION_TOKEN_HASH: ${{ inputs.session_token_hash }}
    steps:
      - name: Validate the session length
        run: |
          set -euo pipefail
          if [[ ! "$SESSION_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "session_minutes must be a whole number of minutes, got '$SESSION_MINUTES'"
            exit 1
          fi
          # 10# keeps a leading zero from being read as octal.
          MINUTES=$((10#$SESSION_MINUTES))
          if (( MINUTES < 1 || MINUTES > 300 )); then
            echo "session_minutes must be 1-300, got $MINUTES"
            exit 1
          fi
          if [[ ! "$SESSION_TOKEN_HASH" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "session_token_hash must be 64 hex characters (the SHA-256 of the session token), got ${#SESSION_TOKEN_HASH} characters"
            exit 1
          fi
          echo "SESSION_MINUTES=$MINUTES" >> "$GITHUB_ENV"
          echo "session: ${MINUTES} minutes"

      # The streamer is a Swift build against ScreenCaptureKit: ~25 s on this image,
      # and it only changes when bin/screen-stream.swift does. Keyed by commit so a
      # second session at the same revision restores the binary instead of rebuilding.
      - name: Restore the screen streamer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/screen-stream
          key: screen-stream-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      # Tailscale first (it is the only network dependency), with the streamer compile
      # running behind it. A failed compile is not fatal: the hold step falls back to a
      # screencapture loop, and the self-test uses cliclick for input.
      - name: Prepare the desktop
        timeout-minutes: 10
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RUN_ID: ${{ github.run_id }}
          SERVER_REPO: ${{ github.repository }}
          SERVER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$LOGS"
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1

          STREAM="$RUNNER_TEMP/screen-stream"
          COMPILE=""
          if [[ -x "$STREAM" ]]; then
            echo "screen streamer restored from the cache"
          else
            if curl -fsSL "https://raw.githubusercontent.com/${SERVER_REPO}/${SERVER_SHA}/bin/screen-stream.swift" \
                -o "$RUNNER_TEMP/screen-stream.swift"; then
              xcrun swiftc -O -swift-version 5 -o "$STREAM" \
                "$RUNNER_TEMP/screen-stream.swift" > "$LOGS/swiftc.log" 2>&1 &
              COMPILE=$!
              echo "compiling the screen streamer in the background"
            else
              echo "warning: could not fetch bin/screen-stream.swift from ${SERVER_SHA:0:7}"
            fi
          fi

          if [[ -z "${TAILSCALE_AUTH_KEY:-}" ]]; then
            echo "TAILSCALE_AUTH_KEY is empty"
            exit 1
          fi
          # This repo's Actions policy allows only GitHub-owned actions and Tailscale's
          # macOS support builds from source, so the client comes from Homebrew: a
          # bottle on this image (measured ~8 s) with a system daemon that outlives
          # this step.
          if ! command -v tailscale >/dev/null 2>&1; then
            brew install tailscale
          fi
          if ! command -v cliclick >/dev/null 2>&1; then
            # Soft: the streamer injects input itself, cliclick is only the fallback
            # used while it is unavailable.
            brew install cliclick >/dev/null 2>&1 \
              || echo "warning: cliclick is unavailable; input falls back to the streamer socket only"
          fi

          PREFIX=$(brew --prefix)
          TS=$(command -v tailscale || true)
          [[ -n "$TS" ]] || TS="$PREFIX/bin/tailscale"
          if [[ ! -x "$TS" ]]; then
            echo "tailscale is not installed at $TS"
            exit 1
          fi
          echo "$(dirname "$TS")" >> "$GITHUB_PATH"
          {
            echo "TAILSCALE=$TS"
            echo "STREAM=$STREAM"
          } >> "$GITHUB_ENV"

          sudo "$PREFIX/bin/tailscaled" install-system-daemon || true
          # install-system-daemon returns before the socket answers; `up` would fail
          # with "failed to connect to local tailscaled" if it ran immediately.
          for _ in $(seq 1 40); do
            if "$TS" status --json 2>/dev/null | jq -e . >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

          # `up` has no --ephemeral flag: ephemerality is a property of the auth key.
          # The key is never echoed; the log holds the client's own error text.
          UP_LOG="$LOGS/tailscale-up.log"
          if ! "$TS" up --authkey="$TAILSCALE_AUTH_KEY" \
              --hostname="ios-ci-${RUN_ID}" --timeout=120s > "$UP_LOG" 2>&1; then
            tail -20 "$UP_LOG"
            if grep -qi 'invalid key' "$UP_LOG"; then
              echo "TAILSCALE_AUTH_KEY was rejected: paste a reusable auth key (tskey-auth-…),"
              echo "not an OAuth client secret, from https://login.tailscale.com/admin/settings/keys"
              case "$TAILSCALE_AUTH_KEY" in
                tskey-auth-*) echo "stored value is an auth key but was rejected: it may be expired, revoked, or already used" ;;
                tskey-client-*) echo "stored value is an OAuth client secret (tskey-client-…): use a reusable auth key" ;;
                tskey-api-*) echo "stored value is an API token (tskey-api-…): use a reusable auth key" ;;
                *) echo "stored value is ${#TAILSCALE_AUTH_KEY} characters and does not start with tskey-" ;;
              esac
            fi
            exit 1
          fi
          "$TS" status 2>&1 | tail -5 || true

          if [[ -n "$COMPILE" ]]; then
            set +e
            wait "$COMPILE"
            COMPILE_STATUS=$?
            set -e
            if [[ "$COMPILE_STATUS" != "0" || ! -x "$STREAM" ]]; then
              tail -20 "$LOGS/swiftc.log" 2>/dev/null || true
              echo "warning: could not build the screen streamer; using a screencapture loop"
              rm -f "$STREAM"
            else
              echo "screen streamer built: $STREAM"
            fi
          elif [[ ! -x "$STREAM" ]]; then
            echo "warning: no screen streamer; using a screencapture loop"
          fi

      # This step is the session: it opens the desktop, proves frames and input work,
      # and then holds the VM for the requested minutes. Captures run from this shell
      # because it carries the image's screen-recording grant: the console session is a
      # different TCC responsibility chain, and a capture there raises a modal consent
      # dialog that swallows every click.
      - name: Open the desktop
        timeout-minutes: 310
        env:
          RUN_ID: ${{ github.run_id }}
          SERVER_REPO: ${{ github.repository }}
          SERVER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOGS="$RUNNER_TEMP/logs"
          mkdir -p "$LOGS"
          exec > >(tee -a "$LOGS/desktop-step.log") 2>&1

          TAILSCALE="${TAILSCALE:-}"
          if [[ ! -x "$TAILSCALE" ]]; then
            echo "tailscale is not available; 'Prepare the desktop' did not finish"
            exit 1
          fi
          STREAM="${STREAM:-$RUNNER_TEMP/screen-stream}"

          sudo pmset -a displaysleep 0 sleep 0 disksleep 0 || true
          caffeinate -u -t 2 || true
          CONSOLE_USER=$(stat -f%Su /dev/console 2>/dev/null || echo root)
          CONSOLE_UID=$(id -u "$CONSOLE_USER" 2>/dev/null || echo 501)
          CONSOLE_HOME=$(dscl . -read "/Users/${CONSOLE_USER}" NFSHomeDirectory 2>/dev/null \
            | awk '{print $2}')
          [[ -n "$CONSOLE_HOME" ]] || CONSOLE_HOME="/Users/${CONSOLE_USER}"
          echo "console user: ${CONSOLE_USER} (${CONSOLE_HOME})"

          FRAME=/tmp/desktop-frame.jpg
          # A frame left by the image (or a previous step) would make /stats claim a
          # picture that nobody is producing; the flags below are this run's verdicts.
          rm -f "$FRAME" "$FRAME.beat" "$FRAME.stat" "$FRAME.tmp" \
                /tmp/desktop-input-ok /tmp/desktop-input-checked

          # Input needs real CGEvents: System Events' position clicks are no-ops.
          CLICLICK=$(command -v cliclick || echo /opt/homebrew/bin/cliclick)
          echo "cliclick: ${CLICLICK}"

          # Accessibility and capture grants, in BOTH databases: the console session
          # consults its own user database, and a grant only in the system one leaves
          # events dropped after the consent prompt times out.
          USER_TCC="/Users/${CONSOLE_USER}/Library/Application Support/com.apple.TCC/TCC.db"
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$USER_TCC"; do
            for client in "/usr/bin/python3" "$CLICLICK" "/bin/bash" "/usr/bin/osascript" "$STREAM"; do
              for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
                sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, flags) values ('$service','$client',1,2,0,1,0)" 2>&1 | head -1 || true
              done
            done
          done
          sudo killall tccd 2>/dev/null || true
          sleep 1

          curl -fsSL "https://raw.githubusercontent.com/${SERVER_REPO}/${SERVER_SHA}/bin/desktop-server.py" \
            -o "$RUNNER_TEMP/desktop-server.py"
          TS_IP=$("$TAILSCALE" ip -4 2>/dev/null | head -1 || true)
          TS_DNS=$("$TAILSCALE" status --json 2>/dev/null | jq -r '.Self.DNSName // empty' \
            | sed 's/\.$//' || true)
          if [[ -z "$TS_IP" && -z "$TS_DNS" ]]; then
            echo "could not determine the Tailscale address"
            "$TAILSCALE" status || true
            exit 1
          fi
          HOST="${TS_IP:-$TS_DNS}"
          echo "tailnet address: ${HOST}"

          # IOS_CI_UPLOAD_HOME: `launchctl asuser` keeps the uid (root), so the server
          # cannot derive the tester's home from its own credentials.
          sudo launchctl asuser "$CONSOLE_UID" /bin/bash -c \
            "IOS_CI_UPLOAD_HOME='$CONSOLE_HOME' nohup /usr/bin/python3 '$RUNNER_TEMP/desktop-server.py' 6080 '$SESSION_TOKEN_HASH' '$HOST' > '$LOGS/desktop-server.log' 2>&1 &"
          for _ in $(seq 1 40); do
            sudo lsof -iTCP:6080 -sTCP:LISTEN >/dev/null 2>&1 && break
            sleep 0.25
          done
          if ! sudo lsof -iTCP:6080 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "the desktop server is not listening on 6080"
            cat "$LOGS/desktop-server.log" 2>/dev/null || true
            exit 1
          fi
          echo "desktop server listening on ${HOST}:6080"

          # Start it if there is one, and take one frame either way: /stats counts
          # frames, and the page paints from the file.
          STREAM_PID=""
          if [[ -x "$STREAM" ]]; then
            "$STREAM" "$FRAME" 60 0.45 960 >/dev/null 2>"$LOGS/screen-stream.log" &
            STREAM_PID=$!
            for _ in $(seq 1 40); do
              [[ -s "$FRAME" ]] && break
              sleep 0.25
            done
            if [[ ! -s "$FRAME" ]]; then
              echo "the screen streamer produced no frame; using screencapture for the session"
              kill "$STREAM_PID" 2>/dev/null || true
              wait "$STREAM_PID" 2>/dev/null || true
              STREAM_PID=""
              tail -20 "$LOGS/screen-stream.log" 2>/dev/null || true
            else
              echo "screen stream: $(head -1 "$LOGS/screen-stream.log" 2>/dev/null)"
            fi
          fi
          if [[ -z "$STREAM_PID" ]]; then
            screencapture -x -t jpg "$FRAME.tmp" 2>/dev/null \
              && mv -f "$FRAME.tmp" "$FRAME" 2>/dev/null || true
          fi

          # Self-test, once: a click near the Apple menu must repaint the screen. The
          # after-shot is taken BEFORE Escape closes the menu again, or the diff would
          # cancel itself out. Escape still runs, so the desktop is left as it was.
          BEFORE_PNG="$RUNNER_TEMP/input-before.png"
          AFTER_PNG="$RUNNER_TEMP/input-after.png"
          screencapture -x -t png "$BEFORE_PNG" 2>/dev/null || true
          USED_SOCKET=0
          if [[ -n "$STREAM_PID" ]] && exec 3<>/dev/tcp/127.0.0.1/7777 2>/dev/null; then
            printf '%s\n' '{"t":"mouse","type":"down","x":20,"y":20}' \
                          '{"t":"mouse","type":"up","x":20,"y":20}' >&3
            USED_SOCKET=1
          elif [[ -x "$CLICLICK" ]]; then
            "$CLICLICK" c:20,20 || true
          fi
          sleep 0.6
          screencapture -x -t png "$AFTER_PNG" 2>/dev/null || true
          BEFORE=$(shasum -a 256 "$BEFORE_PNG" 2>/dev/null | awk '{print $1}')
          AFTER=$(shasum -a 256 "$AFTER_PNG" 2>/dev/null | awk '{print $1}')
          touch /tmp/desktop-input-checked
          if [[ -n "$BEFORE" && "$BEFORE" != "$AFTER" ]]; then
            touch /tmp/desktop-input-ok
            echo "input self-test: the click changed the screen"
          else
            echo "input self-test: NO CHANGE (clicks are not landing)"
          fi
          if [[ "$USED_SOCKET" == "1" ]]; then
            printf '%s\n' '{"t":"key","code":53}' >&3
            exec 3>&-
          else
            osascript -e 'tell application "System Events" to key code 53' >/dev/null 2>&1 || true
          fi

          # The advertised minutes start now, not at dispatch: the tester's clock
          # begins when the desktop is usable.
          END=$(( $(date +%s) + 10#${SESSION_MINUTES} * 60 ))
          echo "desktop ready; holding ${SESSION_MINUTES} minutes"
          # The assertion has to live in the console session: started from here it does
          # not stop the display from blanking, and `screencapture` then blocks on the
          # sleeping display (frames minutes apart).
          sudo launchctl asuser "$CONSOLE_UID" /usr/bin/caffeinate -d -i -m -s -u \
            -t $(( 10#${SESSION_MINUTES} * 60 + 600 )) 2>/dev/null &
          set +e                       # a dead streamer must not end the hold
          if [[ -n "$STREAM_PID" ]]; then
            while (( $(date +%s) < END )) && kill -0 "$STREAM_PID" 2>/dev/null; do
              sleep 1
            done
            kill "$STREAM_PID" 2>/dev/null
            wait "$STREAM_PID" 2>/dev/null
            (( $(date +%s) >= END )) \
              || echo "the screen streamer exited early; using screencapture for the rest"
          fi
          # Fallback capture in the foreground: a loop inside a background subshell is
          # napped to about one frame a second, while the same loop from the step's own
          # shell runs at the capture cost (~4 fps). The beat keeps /stats.alive true.
          while (( $(date +%s) < END )); do
            screencapture -x -t jpg "$FRAME.tmp" 2>/dev/null \
              && mv -f "$FRAME.tmp" "$FRAME" 2>/dev/null
            : > "$FRAME.beat"
            sleep 0.03
          done
          set -e
          echo "session ended: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      - name: Clean up
        if: always()
        run: |
          set +e
          # Drop the node from the tailnet now instead of waiting for the ephemeral key
          # to expire; the VM is destroyed with the job either way.
          TS=${TAILSCALE:-$(brew --prefix)/bin/tailscale}
          [[ -x "$TS" ]] && sudo "$TS" logout
          true
