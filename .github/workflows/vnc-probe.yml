name: vnc-probe
run-name: vnc-auth probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Which account credential can be set
        env:
          PW: ${{ secrets.VNC_USER_PASSWORD }}
        run: |
          set +e
          set -uo pipefail
          echo "console user: $(stat -f%Su /dev/console)  whoami: $(whoami)  pw length: ${#PW}"
          try() {
            local name="$1"; shift
            echo "== $name"
            "$@" 2>&1 | tail -3 | sed 's/^/   out: /'
            if dscl . -authonly runner "$PW" 2>/dev/null; then
              echo "   runner authonly: OK"
            else
              echo "   runner authonly: FAILED"
            fi
          }

          try "dscl passwd"                sudo dscl . -passwd /Users/runner "$PW"
          try "dscl passwd (empty old)"    sudo dscl . -passwd /Users/runner "" "$PW"
          try "passwd as root (stdin)"     bash -c 'printf "%s\n%s\n" "$PW" "$PW" | sudo passwd runner'
          try "sysadminctl reset (admin=runner, old empty)" \
              sudo sysadminctl -resetPasswordFor runner -newPassword "$PW" -adminUser runner -adminPassword ""
          try "sysadminctl off"            sudo sysadminctl -off

          echo "== create tester admin user"
          sudo sysadminctl -addUser tester -fullName "VNC Tester" -password "$PW" -admin 2>&1 | tail -3 | sed 's/^/   out: /'
          if dscl . -authonly tester "$PW" 2>/dev/null; then echo "   tester authonly: OK"; else echo "   tester authonly: FAILED"; fi
          echo "== users: $(dscl . -list /Users | grep -v '^_' | tr '\n' ' ')"
          echo "== runner record: $(sudo dscl . -read /Users/runner AuthenticationAuthority 2>&1 | head -2 | tr '\n' ' ')"
          true
