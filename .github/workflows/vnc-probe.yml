name: vnc-probe
run-name: vnc-probe ${{ inputs.image }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: Runner label to probe
        required: true
        default: macos-26-intel
        type: string

permissions:
  contents: read

jobs:
  probe:
    name: probe
    runs-on: ${{ inputs.image }}
    timeout-minutes: 20
    steps:
      - name: Tailscale join
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e
          set -uo pipefail
          TP=$(brew --prefix)
          brew install tailscale 2>&1 | tail -3
          sudo "$TP/bin/tailscaled" install-system-daemon 2>&1 | tail -4
          sudo "$TP/bin/tailscale" up --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="probe-${GITHUB_RUN_ID}-$(uname -m)" --timeout=120s 2>&1 | head -6
          echo "== status:"; "$TP/bin/tailscale" status 2>&1 | head -6
          echo "== dnsname: $("$TP/bin/tailscale" status --json 2>/dev/null | jq -r '.Self.DNSName // "MISSING"')"
          echo "== ipv4: $("$TP/bin/tailscale" ip -4 2>&1 | head -1)"
          sudo "$TP/bin/tailscale" logout 2>&1 | tail -2
          true

      - name: VNC credentials
        env:
          ACCOUNT_PW: ${{ secrets.VNC_USER_PASSWORD }}
        run: |
          set +e
          set -uo pipefail
          K=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          handshake() {
            python3 - <<'PY'
          import socket
          try:
              s = socket.create_connection(("127.0.0.1", 5900), 5)
              s.recv(12)
              s.sendall(b"RFB 003.889\n")
              n = s.recv(1)
              if n:
                  cnt = n[0]
                  print("security types:", list(s.recv(cnt)) if cnt else "none")
          except Exception as e:
              print("error:", e)
          PY
          }
          echo "== account password:"
          sudo dscl . -passwd "/Users/$(whoami)" "$ACCOUNT_PW" 2>&1 | tail -2
          sudo "$K" -activate -configure -access -on -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes 2>&1 | tail -3
          sudo launchctl enable system/com.apple.screensharing 2>&1 | tail -2
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>&1 | tail -2
          sudo launchctl kickstart -k system/com.apple.screensharing 2>&1 | tail -2
          sleep 6
          echo "== baseline:"; handshake
          echo "== write VNCSettings.txt:"
          printf '%s' 'probe123' | perl -we '
            BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA" }
            $_ = <>;
            chomp;
            s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n"' \
            | sudo tee /Library/Preferences/com.apple.VNCSettings.txt
          sudo chmod 644 /Library/Preferences/com.apple.VNCSettings.txt
          sudo launchctl kickstart -k system/com.apple.screensharing 2>&1 | tail -2
          sleep 6
          echo "== after VNCSettings.txt:"; handshake
          echo "== write VNCLegacyPasswords:"
          MD5=$(printf '%s' 'probe123' | md5 -q)
          sudo /usr/libexec/PlistBuddy -c "Delete :VNCLegacyPasswords" /Library/Preferences/com.apple.RemoteManagement.plist 2>/dev/null
          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords array" /Library/Preferences/com.apple.RemoteManagement.plist 2>&1 | tail -1
          sudo /usr/libexec/PlistBuddy -c "Add :VNCLegacyPasswords:0 string $MD5" /Library/Preferences/com.apple.RemoteManagement.plist 2>&1 | tail -1
          sudo launchctl kickstart -k system/com.apple.screensharing 2>&1 | tail -2
          sleep 6
          echo "== after VNCLegacyPasswords:"; handshake
          echo "== settings files:"; sudo ls -l /Library/Preferences/com.apple.VNCSettings.txt 2>&1
          sudo defaults read /Library/Preferences/com.apple.RemoteManagement 2>&1 | head -10
          true
