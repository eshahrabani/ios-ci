name: idle probe
run-name: idle probe
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  p:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Background loop vs foreground loop
        run: |
          set +e
          rate() { # rate <label> <seconds>
            local label=$1 secs=$2 end=$(( $(date +%s) + $2 )) n=0 prev=0
            while (( $(date +%s) < end )); do
              t=$(stat -f%m /tmp/bg.jpg 2>/dev/null || echo 0)
              if [[ "$t" != "$prev" && "$t" != 0 ]]; then n=$((n+1)); prev=$t; fi
              sleep 0.2
            done
            echo "rate $label frames=$n in ${secs}s"
          }
          rm -f /tmp/bg.jpg /tmp/bg.jpg.tmp
          ( set +e; while true; do screencapture -x -t jpg /tmp/bg.jpg.tmp 2>/dev/null && mv -f /tmp/bg.jpg.tmp /tmp/bg.jpg 2>/dev/null; sleep 0.03; done ) &
          LOOP=$!
          rate background 8
          kill $LOOP 2>/dev/null
          rm -f /tmp/bg.jpg /tmp/bg.jpg.tmp
          ( set +e; while true; do screencapture -x -t jpg /tmp/bg.jpg.tmp 2>/dev/null && mv -f /tmp/bg.jpg.tmp /tmp/bg.jpg 2>/dev/null; sleep 0.03; done ) &
          LOOP=$!
          rate background-again 8
          kill $LOOP 2>/dev/null
          rm -f /tmp/notify
          n=0; start=$(date +%s)
          while (( $(date +%s) - start < 8 )); do screencapture -x -t jpg /tmp/bg.jpg.tmp && mv -f /tmp/bg.jpg.tmp /tmp/bg.jpg; n=$((n+1)); sleep 0.03; done
          echo "rate foreground frames=$n in 8s"
